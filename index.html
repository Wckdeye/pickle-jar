<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>The Pickle Jar</title>
<meta name="theme-color" content="#0B0D0A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F2E8" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pickle Jar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Shop counter: near-black ground, cream ink, one pickle-lime accent, gold for money earned */
:root{
  --bg:#0B0D0A; --surface:#141811; --surface-2:#1C2118; --line:#2A3124; --ink:#F2EEDF; --muted:#9AA38E;
  --accent:#C5F03C; --accent-ink:#10140A; --accent-text:#C5F03C; --gold:#E7B65E;
  --good:#71E0A3; --bad:#FF7B68; --warn:#FFC75A;
  --halo:rgba(197,240,60,.16);
  --f-display:"Archivo",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root{
  --bg:#F5F2E8; --surface:#FFFFFF; --surface-2:#EEEADC; --line:#DDD8C6; --ink:#151A10; --muted:#5F6753;
  --accent:#B9E52E; --accent-ink:#121A05; --accent-text:#4F7300; --gold:#A86E0E;
  --good:#11895A; --bad:#CC3D28; --warn:#A86A00; --halo:rgba(120,170,0,.14);
  color-scheme:light}}

*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(96px + env(safe-area-inset-bottom,0px))}
body.no-nav{padding-bottom:24px}
body.has-cart{padding-bottom:calc(168px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
.wrap{max-width:620px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .gold{color:var(--gold)}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;font-weight:700;text-wrap:balance}
.eyebrow{font-family:var(--f-num);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .jar{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand h1{font-size:20px;font-stretch:80%;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--f-num);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.sync{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--good)} .sync.pending i{background:var(--warn)} .sync.err i{background:var(--bad)}
.sync.busy i{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}
.section-h h2{font-size:17px;font-stretch:90%}
.link{background:none;border:0;color:var(--accent-text);font-weight:700;font-size:13.5px;padding:6px 0}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right}

.hero{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.hero::after{content:"";position:absolute;width:280px;height:280px;right:-110px;top:-140px;pointer-events:none;background:radial-gradient(closest-side,var(--halo),transparent)}
.hero>*{position:relative}
.hero .big{font-family:var(--f-num);font-size:clamp(30px,9vw,40px);font-weight:600;letter-spacing:-.04em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.kpis .v{font-family:var(--f-num);font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:inherit}
.li:last-child{border-bottom:0}
.li .t{font-weight:600}
.li .s{font-size:12.5px;color:var(--muted)}
.amt{font-family:var(--f-num);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.low{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.out{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.badge.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.badge.owe{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.thumb{width:44px;height:44px;border-radius:11px;background:var(--surface-2);flex:none;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-family:var(--f-display);font-weight:800;font-size:15px;font-stretch:75%}
.thumb img{width:100%;height:100%;object-fit:cover}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}

/* sell grid */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.search input{flex:1;border:0;background:none;padding:12px 0;outline:none;min-width:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;color:inherit;min-height:100%}
.pcard .img{aspect-ratio:4/3;border-radius:11px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:26px;font-stretch:70%;color:var(--muted);text-transform:uppercase}
.pcard .img img{width:100%;height:100%;object-fit:cover}
.pcard .nm{font-weight:700;font-size:13.5px;line-height:1.25}
.pcard .pr{font-family:var(--f-num);font-weight:600;font-size:14px}
.pcard[disabled]{opacity:.45}
.pcard .incart{position:absolute;top:6px;right:6px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-num);font-weight:700;font-size:12px;border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;padding:0 6px}

.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;width:min(620px,calc(100% - 28px));
  display:flex;align-items:center;gap:12px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:13px 16px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.cartbar .amt{font-size:16px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:700;letter-spacing:.02em}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] .ic{color:var(--accent-text)}
nav.tabs .sellbtn{position:relative}
nav.tabs .sellbtn .pill{width:46px;height:32px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center}
nav.tabs .sellbtn[aria-current="page"] .pill{background:var(--accent)}
nav.tabs .sellbtn[aria-current="page"] .pill .ic{color:var(--accent-ink)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field>label,.lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.in-text,select.in-text,textarea.in-text{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;min-height:46px}
.in-text:focus{border-color:var(--accent)}
.in-money{font-family:var(--f-num);font-weight:600;font-size:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:13px;padding:12px 16px;font-weight:700;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.block{width:100%}
.btn[disabled]{opacity:.5}
.btns{display:flex;gap:10px}
.btns .btn{flex:1}
.note{font-size:12.5px;color:var(--muted);line-height:1.45}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:1em}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;overflow:hidden;flex:none}
.stepper button{border:0;background:var(--surface-2);width:34px;height:34px;font-size:18px;font-weight:700}
.stepper span{min-width:30px;text-align:center;font-family:var(--f-num);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.totals{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.totals .grand{font-size:18px;font-weight:800}
.sep{height:1px;background:var(--line);margin:12px 0}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:620px;max-height:92dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out;overscroll-behavior:contain}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet .sh h2{font-size:19px;font-stretch:90%}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:fade .2s}
.toast.bad{background:var(--bad);color:#fff}

/* auth */
.auth{min-height:92dvh;display:flex;flex-direction:column;justify-content:center;max-width:400px;margin:0 auto;padding-block:30px}
.auth .logo{width:64px;height:64px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-bottom:16px}
.auth h1{font-size:34px;font-stretch:75%;text-transform:uppercase;line-height:1}
.receipt{font-family:var(--f-num);font-size:13px;background:var(--surface-2);border-radius:12px;padding:14px;white-space:pre-wrap;line-height:1.5}
.vchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--muted);margin-right:8px}
.vchip i{width:8px;height:8px;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
